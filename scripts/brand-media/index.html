<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stratos Edge brand media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
<style>
  /* Tokens: the website's tokens.css and fonts.css. --sky-wash is the site's one sky treatment (home-intro.css). */
  :root {
    --navy: #04242d; --coral: #ff6b4a; --paper: #f8f8f8; --muted: #4c6065;
    --headline: 'Work Sans', sans-serif; --body: 'Source Sans 3', sans-serif; --document: 'Source Serif 4', serif;
    --sky-wash: linear-gradient(180deg, rgba(248,249,249,.82) 0%, rgba(246,247,247,.78) 55%, rgba(253,239,233,.82) 100%);
  }
  html, body { margin: 0; background: #fff; }
  body { font-family: var(--body); color: var(--navy); -webkit-font-smoothing: antialiased; }
  .board { position: relative; overflow: hidden; isolation: isolate; box-sizing: border-box; }

  .sky { position: absolute; inset: 0; z-index: -1; background: var(--paper); }
  .sky img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 48%; }
  .sky .wash { position: absolute; inset: 0; background: var(--sky-wash); }

  /* The wordmark and its letters, recoloured through masks; the renderer supplies the images as data URIs. */
  .mask { display: inline-block; background: var(--navy); -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .mark { --src: var(--mark-url); aspect-ratio: 5692 / 1082; }
  .g-s { --src: var(--s-url); aspect-ratio: 369 / 514; }
  .g-e { --src: var(--e-url); aspect-ratio: 300 / 496; }
  .g-pipe { --src: var(--pipe-url); aspect-ratio: 14 / 937; opacity: .5; }

  .eyebrow { font-family: var(--headline); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin: 0; }
  .h { font-family: var(--headline); font-weight: 300; line-height: 1.04; letter-spacing: -.02em; color: var(--navy); margin: 0; text-wrap: balance; }
  .h .dot { color: var(--coral); }
  .lead { font-family: var(--body); color: var(--muted); line-height: 1.45; margin: 0; text-wrap: pretty; }
  .small { font-family: var(--body); color: var(--muted); letter-spacing: .02em; }
  .dotafter { position: relative; display: inline-block; line-height: 0; }
  .dotafter::after { content: ""; position: absolute; border-radius: 50%; background: var(--coral); width: var(--d); height: var(--d); right: calc(var(--d) * -1.35); bottom: calc(var(--d) * .1); }

  /* Lettermark options. A: the serif S (the current favicon's idea). B: the S cut from the wordmark. C: S | E from the
     wordmark. D: Work Sans at the headline weight. All carry the coral full stop. */
  .serif-s { font-family: var(--document); font-weight: 500; font-style: italic; color: var(--navy); line-height: 1; letter-spacing: -.02em; }
  .sans-s { font-family: var(--headline); font-weight: 300; color: var(--navy); line-height: 1; letter-spacing: -.03em; }
</style>
</head>
<body>
<script>
  const sky = `<div class="sky"><img src="src/sky-clouds.jpg" alt="" /><div class="wash"></div></div>`;
  const H = (text) => text.endsWith('.') ? `${text.slice(0, -1)}<span class="dot">.</span>` : text;
  const copy = {
    oneLiner: 'AI strategy consulting.',
    hero: 'Turn AI into measurable business advantage.',
    sentence: 'We help you decide what to do next with AI, what it should return, and who should deliver it.',
    confidence: 'Confidence before technology.',
    site: 'stratosedge.ai',
  };

  // Lettermarks, sized by the board's height. Each returns markup centred by the caller.
  const letter = {
    serif: (h) => `<span class="serif-s dotafter" style="font-size:${h * .64}px;--d:${h * .12}px;margin-right:${h * .14}px">S</span>`,
    // The dot sits on a wrapper: a mask clips its own pseudo-elements.
    wordmark: (h) => `<span class="dotafter" style="--d:${h * .105}px;margin-right:${h * .14}px"><span class="mask g-s" style="height:${h * .46}px"></span></span>`,
    monogram: (h) => `<span style="display:inline-flex;align-items:center;gap:${h * .075}px;margin-right:${h * .12}px"><span class="mask g-s" style="height:${h * .4}px"></span><span class="mask g-pipe" style="height:${h * .5}px"></span><span class="dotafter" style="--d:${h * .09}px"><span class="mask g-e" style="height:${h * .386}px"></span></span></span>`,
    sans: (h) => `<span class="sans-s dotafter" style="font-size:${h * .7}px;--d:${h * .12}px;margin-right:${h * .14}px">S</span>`,
  };

  // LinkedIn banners. Measured on linkedin.com, 12 Oct 2026, desktop: the personal cover shows at 4:1; the photo ring is
  // 20% of the cover's width, 3% in from the left, its top at 51% of the cover's height (it hangs below the cover). The
  // phone app draws the photo nearer 27% of the width. So the words live right of 30% and, where they reach below the
  // photo's top, stay in that zone. The company cover shows at 1128:191 with the logo tile 16% wide at 3%, top at 52%.
  const zone = (w, h) => `padding:${h * .1}px ${w * .04}px ${h * .12}px ${w * .3}px`;
  const personal = (w, h, inner, align = 'center') => `<div class="board" style="width:${w}px;height:${h}px;display:flex;flex-direction:column;justify-content:center;align-items:${align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center'};text-align:${align};${zone(w, h)}">${sky}${inner}</div>`;
  const company = (w, h, inner, align = 'center') => `<div class="board" style="width:${w}px;height:${h}px;display:flex;flex-direction:column;justify-content:center;align-items:${align === 'left' ? 'flex-start' : 'center'};text-align:${align};padding:${h * .1}px ${w * .04}px ${h * .1}px ${w * .24}px">${sky}${inner}</div>`;
  const line = (h, text, size) => `<p class="h" style="font-size:${h * size}px;white-space:nowrap">${H(text)}</p>`;
  const sub = (h, text, size, top) => `<p class="small" style="font-size:${h * size}px;margin-top:${h * top}px;display:block">${text}</p>`;
  const roles = { micah: 'Co-founder and Chief Strategy Officer, Stratos Edge', jeff: 'Co-founder, Stratos Edge' };

  const lines = {
    micahSeat: '26 years in the CIO\'s seat. Now on your side of the table.',
    micahReturns: 'What the AI already in your building returns, and what to do next.',
    micahLeaders: 'Helping leaders see what AI returns, and what to do next.',
    micahFact: '26 years as a CIO-level executive at mid-market companies',
    jeffDecades: 'Four decades connecting the mid\u2011market to technology that fits.',
    jeffDeals: 'More than 1,000 deals. One question: what will it return?',
    jeffCall: 'Bring the problem. We\'ll bring the plan.',
    jeffFact: 'Four decades in the technology channel, more than 1,000 deals',
  };
  const banners = {
    // Micah: his line, then lines drawn from the About page and his own headline.
    'micah-1-confidence': (w, h) => personal(w, h, line(h, copy.confidence, .17)),
    'micah-2-cio-seat': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .14}px;max-width:${w * .56}px">${H(lines.micahSeat)}</p>`, 'left'),
    'micah-3-what-it-returns': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .135}px;max-width:${w * .6}px">${H(lines.micahReturns)}</p>`, 'left'),
    'micah-4-confidence-fact': (w, h) => personal(w, h, line(h, copy.confidence, .155) + sub(h, lines.micahFact, .062, .05), 'left'),
    'micah-5-helping-leaders-right': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .14}px;max-width:${w * .56}px">${H(lines.micahLeaders)}</p>` + sub(h, copy.site, .058, .05), 'right'),
    // Jeff: the old banner's idea refreshed, his numbers, and the call he takes.
    'jeff-1-four-decades': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .14}px;max-width:${w * .56}px">${H(lines.jeffDecades)}</p>`, 'left'),
    'jeff-2-thousand-deals': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .14}px;max-width:${w * .56}px">${H(lines.jeffDeals)}</p>`, 'left'),
    'jeff-3-bring-the-problem': (w, h) => personal(w, h, line(h, copy.oneLiner === '' ? '' : lines.jeffCall, .16)),
    'jeff-4-what-we-do-fact': (w, h) => personal(w, h, line(h, copy.oneLiner, .17) + sub(h, lines.jeffFact, .062, .05), 'left'),
    'jeff-5-four-decades-right': (w, h) => personal(w, h, `<p class="h" style="font-size:${h * .14}px;max-width:${w * .56}px">${H(lines.jeffDecades)}</p>` + sub(h, copy.site, .058, .05), 'right'),
    // Employees
    'employee-1-what-we-do-website': (w, h) => personal(w, h, line(h, copy.oneLiner, .17) + sub(h, copy.site, .062, .05), 'left'),
    'employee-2-confidence': (w, h) => personal(w, h, line(h, copy.confidence, .16)),
    'employee-3-wordmark-what-we-do': (w, h) => personal(w, h, `<div class="mark mask" style="width:${w * .2}px"></div>` + `<p class="h" style="font-size:${h * .13}px;margin-top:${h * .08}px;white-space:nowrap">${H(copy.oneLiner)}</p>`, 'left'),
    // Company page
    'company-1-what-we-do-website': (w, h) => company(w, h, `<div style="display:flex;align-items:center;gap:${w * .03}px"><p class="h" style="font-size:${h * .27}px;white-space:nowrap">${H(copy.oneLiner)}</p><span class="small" style="font-size:${h * .105}px;border-left:1px solid rgba(4,36,45,.25);padding-left:${w * .022}px">${copy.site}</span></div>`),
    'company-2-sentence-website': (w, h) => company(w, h, `<p class="h" style="font-size:${h * .2}px;white-space:nowrap">${H(copy.oneLiner)}</p><p class="lead" style="font-size:${h * .082}px;margin-top:${h * .03}px;white-space:nowrap">${copy.sentence}</p><p class="small" style="font-size:${h * .07}px;margin-top:${h * .03}px">${copy.site}</p>`, 'left'),
    'company-3-confidence': (w, h) => company(w, h, line(h, copy.confidence, .27)),
  };

  // Review mockups, to the measured geometry, with the real photos (supplied by the renderer as --photo-*).
  const mock = (id, w) => {
    const isCompany = id.startsWith('company');
    const bh = isCompany ? Math.round(w * 191 / 1128) : Math.round(w / 4);
    const s = w / 792;
    const who = id.startsWith('micah') ? 'micah' : id.startsWith('jeff') ? 'jeff' : null;
    const bar = (x, y, bw, bhh, c = '#e6e9ea') => `<div style="position:absolute;left:${x * s}px;top:${y * s}px;width:${bw * s}px;height:${bhh * s}px;background:${c};border-radius:3px"></div>`;
    const photo = isCompany
      ? `<div style="position:absolute;left:${24 * s}px;top:${bh - 64 * s}px;width:${128 * s}px;height:${128 * s}px;background:#fff;border:1px solid rgba(4,36,45,.12);box-sizing:border-box;display:grid;place-items:center"><div class="mark mask" style="width:${96 * s}px"></div></div>`
      : `<div style="position:absolute;left:${24 * s}px;top:${bh - 96 * s}px;width:${160 * s}px;height:${160 * s}px;border-radius:50%;background:#fff;display:grid;place-items:center"><div style="width:${152 * s}px;height:${152 * s}px;border-radius:50%;background:${who ? `var(--photo-${who}) center / cover` : '#cfd6d8'}"></div></div>`;
    const below = isCompany
      ? bar(24, bh / s + 80, 160, 30, '#d9dddf') + bar(24, bh / s + 118, 420, 16) + bar(24, bh / s + 142, 240, 16)
      : bar(24, bh / s + 96, 119, 30, '#d9dddf') + bar(24, bh / s + 130, 485, 18) + bar(24, bh / s + 152, 300, 18) + bar(24, bh / s + 176, 199, 16) + bar(24, bh / s + 200, 115, 16) + bar(24, bh / s + 225, 101, 48, '#dfe3e4') + bar(133, bh / s + 225, 100, 48, '#eceeef') + bar(565, bh / s + 103, 24, 24, '#04242d') + bar(597, bh / s + 106, 87, 18);
    return `<div style="position:relative;width:${w}px;height:${bh + (isCompany ? 170 : 290) * s}px;background:#fff;overflow:hidden">${banners[id](w, bh)}${photo}${below}</div>`;
  };

  const boards = {
    'sharing-image': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;padding:${h * .12}px ${w * .09}px ${h * .1}px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center">${sky}
      <div class="mark mask" style="width:${w * .2}px"></div>
      <div><p class="eyebrow" style="font-size:${h * .028}px;margin-bottom:${h * .045}px">Stratos Edge</p>
      <p class="h" style="font-size:${h * .135}px">${H(copy.oneLiner)}</p>
      <p class="lead" style="font-size:${h * .046}px;max-width:${w * .66}px;margin:${h * .045}px auto 0">${copy.sentence}</p></div>
      <span class="small" style="font-size:${h * .034}px">${copy.site}</span></div>`,
    ...Object.fromEntries(Object.keys(banners).flatMap((id) => [[`linkedin-${id}`, banners[id]], [`mock-${id}`, (w) => mock(id, w)]])),

    // X header 1500x500 and YouTube banner 2560x1440 (safe area 1546x423, centred).
    'x-header': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;text-align:center">${sky}<div><div class="mark mask" style="width:${w * .3}px"></div><p class="h" style="font-size:${h * .14}px;margin-top:${h * .09}px">${H(copy.oneLiner)}</p></div></div>`,
    'youtube-banner': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;text-align:center">${sky}<div style="width:1546px;height:423px;display:grid;place-items:center"><div><div class="mark mask" style="width:520px"></div><p class="h" style="font-size:64px;margin-top:38px">${H(copy.oneLiner)}</p></div></div></div>`,

    // Profile avatar 400x400 and favicon 512x512, one per lettermark option.
    ...Object.fromEntries(Object.keys(letter).flatMap((k) => [
      [`avatar-${k}`, (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center">${sky}${letter[k](h)}</div>`],
      [`favicon-${k}`, (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;border-radius:${w * .2}px">${sky}${letter[k](h)}</div>`],
    ])),
  };

  const params = new URLSearchParams(location.search);
  const id = params.get('board'); const w = Number(params.get('w')); const h = Number(params.get('h'));
  if (boards[id]) document.body.innerHTML = boards[id](w, h);
  else document.body.innerHTML = `<pre>${Object.keys(boards).join('\n')}</pre>`;
</script>
</body>
</html>

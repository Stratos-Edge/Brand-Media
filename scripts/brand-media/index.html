<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stratos Edge brand media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
<style>
  /* Tokens: the website's tokens.css and fonts.css. --sky-wash is the site's one sky treatment (home-intro.css). */
  :root {
    --navy: #04242d; --coral: #ff6b4a; --paper: #f8f8f8; --muted: #4c6065;
    --headline: 'Work Sans', sans-serif; --body: 'Source Sans 3', sans-serif; --document: 'Source Serif 4', serif;
    --sky-wash: linear-gradient(180deg, rgba(248,249,249,.82) 0%, rgba(246,247,247,.78) 55%, rgba(253,239,233,.82) 100%);
  }
  html, body { margin: 0; background: #fff; }
  body { font-family: var(--body); color: var(--navy); -webkit-font-smoothing: antialiased; }
  .board { position: relative; overflow: hidden; isolation: isolate; box-sizing: border-box; }

  .sky { position: absolute; inset: 0; z-index: -1; background: var(--paper); }
  .sky img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 48%; }
  .sky .wash { position: absolute; inset: 0; background: var(--sky-wash); }

  /* The wordmark and its letters, recoloured through masks; the renderer supplies the images as data URIs. */
  .mask { display: inline-block; background: var(--navy); -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .mark { --src: var(--mark-url); aspect-ratio: 5692 / 1082; }
  .g-s { --src: var(--s-url); aspect-ratio: 369 / 514; }
  .g-e { --src: var(--e-url); aspect-ratio: 300 / 496; }
  .g-pipe { --src: var(--pipe-url); aspect-ratio: 14 / 937; opacity: .5; }

  .eyebrow { font-family: var(--headline); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin: 0; }
  .h { font-family: var(--headline); font-weight: 300; line-height: 1.04; letter-spacing: -.02em; color: var(--navy); margin: 0; text-wrap: balance; }
  .h .dot { color: var(--coral); }
  .lead { font-family: var(--body); color: var(--muted); line-height: 1.45; margin: 0; text-wrap: pretty; }
  .small { font-family: var(--body); color: var(--muted); letter-spacing: .02em; }
  .dotafter { position: relative; display: inline-block; line-height: 0; }
  .dotafter::after { content: ""; position: absolute; border-radius: 50%; background: var(--coral); width: var(--d); height: var(--d); right: calc(var(--d) * -1.35); bottom: calc(var(--d) * .1); }

  /* Lettermark options. A: the serif S (the current favicon's idea). B: the S cut from the wordmark. C: S | E from the
     wordmark. D: Work Sans at the headline weight. All carry the coral full stop. */
  .serif-s { font-family: var(--document); font-weight: 500; font-style: italic; color: var(--navy); line-height: 1; letter-spacing: -.02em; }
  .sans-s { font-family: var(--headline); font-weight: 300; color: var(--navy); line-height: 1; letter-spacing: -.03em; }
</style>
</head>
<body>
<script>
  const sky = `<div class="sky"><img src="src/sky-clouds.jpg" alt="" /><div class="wash"></div></div>`;
  const H = (text) => text.endsWith('.') ? `${text.slice(0, -1)}<span class="dot">.</span>` : text;
  const copy = {
    oneLiner: 'AI strategy consulting.',
    hero: 'Turn AI into measurable business advantage.',
    sentence: 'We help you decide what to do next with AI, what it should return, and who should deliver it.',
    confidence: 'Confidence before technology.',
    site: 'stratosedge.ai',
  };

  // Lettermarks, sized by the board's height. Each returns markup centred by the caller.
  const letter = {
    serif: (h) => `<span class="serif-s dotafter" style="font-size:${h * .64}px;--d:${h * .12}px;margin-right:${h * .14}px">S</span>`,
    // The dot sits on a wrapper: a mask clips its own pseudo-elements.
    wordmark: (h) => `<span class="dotafter" style="--d:${h * .105}px;margin-right:${h * .14}px"><span class="mask g-s" style="height:${h * .46}px"></span></span>`,
    monogram: (h) => `<span style="display:inline-flex;align-items:center;gap:${h * .075}px;margin-right:${h * .12}px"><span class="mask g-s" style="height:${h * .4}px"></span><span class="mask g-pipe" style="height:${h * .5}px"></span><span class="dotafter" style="--d:${h * .09}px"><span class="mask g-e" style="height:${h * .386}px"></span></span></span>`,
    sans: (h) => `<span class="sans-s dotafter" style="font-size:${h * .7}px;--d:${h * .12}px;margin-right:${h * .14}px">S</span>`,
  };

  // LinkedIn banners. Geometry measured on linkedin.com (12 Oct 2026, desktop): the personal cover displays at 4:1; the
  // photo ring is 160/792 of the cover width (20%), 24/792 from the left (3%), its top 102/198 down (51.5%); the
  // company cover displays at 1128:191 with a 128/792 logo tile (16%) at 24/792, top at 70/134 (52%).
  // Composition: the photo holds the bottom-left, so the words are set right, flush to the same 3% margin the photo
  // keeps on the left, and centred on the cover's height. Both covers display at the same width on the profile, so
  // every size is a fraction of the cover WIDTH: one headline size and one secondary size across the whole set.
  const S = { headline: .0425, secondary: .017, gap: .012, margin: .03 };
  const right = (w, h, inner, left) => `<div class="board" style="width:${w}px;height:${h}px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;padding:0 ${w * S.margin}px 0 ${w * left}px">${sky}${inner}</div>`;
  const hl = (w, text) => `<p class="h" style="font-size:${w * S.headline}px">${H(text)}</p>`;
  const sl = (w, text) => `<p class="small" style="font-size:${w * S.secondary}px;line-height:1.2;margin:${w * S.gap}px 0 0">${text}</p>`;
  const sentence = (w) => `<p class="lead" style="font-size:${w * S.secondary}px;line-height:1.3;margin-top:${w * S.gap}px;max-width:${w * .68}px">${copy.sentence}</p>`;

  // Personal covers (same set for everyone): words start right of 38% so the phone app's larger photo (27%) clears too.
  // Company covers: the logo tile is narrower, so the words may start at 30%.
  const banners = {
    'personal-1-confidence': (w, h) => right(w, h, hl(w, copy.confidence), .38),
    'personal-2-confidence-website': (w, h) => right(w, h, hl(w, copy.confidence) + sl(w, copy.site), .38),
    'personal-3-what-we-do-website': (w, h) => right(w, h, hl(w, copy.oneLiner) + sl(w, copy.site), .38),
    'company-1-what-we-do-website': (w, h) => right(w, h, hl(w, copy.oneLiner) + sl(w, copy.site), .3),
    'company-2-sentence-website': (w, h) => right(w, h, hl(w, copy.oneLiner) + sentence(w) + sl(w, copy.site), .3),
  };

  // Mockups to the measured geometry: the cover at LinkedIn's display width with a placeholder photo (or the logo tile)
  // and blank name lines where LinkedIn draws them.
  const person = `<svg viewBox="0 0 100 100" aria-hidden="true" style="width:100%;height:100%"><circle cx="50" cy="50" r="50" fill="#d5dadc"/><circle cx="50" cy="38" r="17" fill="#fff"/><path d="M17 94c3-20 17-30 33-30s30 10 33 30z" fill="#fff"/></svg>`;
  const mock = (id, w) => {
    const isCompany = id.startsWith('company');
    const bh = isCompany ? Math.round(w * 191 / 1128) : Math.round(w / 4);
    const s = w / 792;
    const bar = (x, y, bw, bhh, c = '#e6e9ea') => `<div style="position:absolute;left:${x * s}px;top:${y * s}px;width:${bw * s}px;height:${bhh * s}px;background:${c};border-radius:3px"></div>`;
    const photo = isCompany
      ? `<div id="photo" style="position:absolute;left:${24 * s}px;top:${70 * s}px;width:${128 * s}px;height:${128 * s}px;background:#fff;border:1px solid rgba(4,36,45,.12);box-sizing:border-box;display:grid;place-items:center"><div class="mark mask" style="width:${96 * s}px"></div></div>`
      : `<div id="photo" style="position:absolute;left:${24 * s}px;top:${102 * s}px;width:${160 * s}px;height:${160 * s}px;border-radius:50%;background:#fff;padding:${4 * s}px;box-sizing:border-box;overflow:hidden"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden">${person}</div></div>`;
    const below = isCompany
      ? bar(24, 134 + 80, 160, 30, '#d9dddf') + bar(24, 134 + 118, 420, 16) + bar(24, 134 + 142, 240, 16)
      : bar(24, 294, 119, 30, '#d9dddf') + bar(24, 328, 485, 18) + bar(24, 350, 300, 18) + bar(24, 372, 199, 16) + bar(24, 398, 115, 16) + bar(24, 423, 101, 48, '#dfe3e4') + bar(133, 423, 100, 48, '#eceeef') + bar(565, 301, 24, 24, '#04242d') + bar(597, 304, 87, 18);
    return `<div id="mock" style="position:relative;width:${w}px;height:${(isCompany ? 134 + 170 : 198 + 290) * s}px;background:#fff;overflow:hidden">${banners[id](w, bh)}${photo}${below}</div>`;
  };

  const boards = {
    // Sharing image: wordmark, the one-liner with the sentence, the site; equal gaps, equal margins top and bottom.
    'sharing-image': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;padding:${h * .115}px ${w * .09}px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center">${sky}
      <div class="mark mask" style="width:${w * .2}px"></div>
      <div><p class="h" style="font-size:${h * .14}px">${H(copy.oneLiner)}</p>
      <p class="lead" style="font-size:${h * .05}px;max-width:${w * .66}px;margin:${h * .05}px auto 0;text-wrap:balance">${copy.sentence}</p></div>
      <span class="small" style="font-size:${h * .036}px">${copy.site}</span></div>`,
    ...Object.fromEntries(Object.keys(banners).flatMap((id) => [[`linkedin-${id}`, banners[id]], [`mock-${id}`, (w) => mock(id, w)]])),

    // X header 1500x500 and YouTube banner 2560x1440 (safe area 1546x423, centred).
    'x-header': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;text-align:center">${sky}<div><div class="mark mask" style="width:${w * .3}px"></div><p class="h" style="font-size:${h * .14}px;margin-top:${h * .09}px">${H(copy.oneLiner)}</p></div></div>`,
    'youtube-banner': (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;text-align:center">${sky}<div style="width:1546px;height:423px;display:grid;place-items:center"><div><div class="mark mask" style="width:520px"></div><p class="h" style="font-size:64px;margin-top:38px">${H(copy.oneLiner)}</p></div></div></div>`,

    // Profile avatar 400x400 and favicon 512x512, one per lettermark option.
    ...Object.fromEntries(Object.keys(letter).flatMap((k) => [
      [`avatar-${k}`, (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center">${sky}${letter[k](h)}</div>`],
      [`favicon-${k}`, (w, h) => `<div class="board" style="width:${w}px;height:${h}px;display:grid;place-items:center;border-radius:${w * .2}px">${sky}${letter[k](h)}</div>`],
    ])),
  };

  const params = new URLSearchParams(location.search);
  const id = params.get('board'); const w = Number(params.get('w')); const h = Number(params.get('h'));
  if (boards[id]) document.body.innerHTML = boards[id](w, h);
  else document.body.innerHTML = `<pre>${Object.keys(boards).join('\n')}</pre>`;
</script>
</body>
</html>

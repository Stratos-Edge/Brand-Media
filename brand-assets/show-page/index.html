<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Stratos Edge Mark</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Crect x='16' y='16' width='480' height='480' rx='112'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='16' y='16' width='480' height='480' fill='%23FDFCFA'/%3E%3C/g%3E%3Crect x='16' y='16' width='480' height='480' rx='112' fill='none' stroke='%2304242D' stroke-opacity='0.09' stroke-width='2'/%3E%3Cg transform='translate(256 256) scale(1.08) translate(-256 -256)'%3E%3Crect x='196' y='118' width='170' height='76' rx='38' fill='%23FF6B4A'/%3E%3Crect x='218' y='218' width='76' height='76' rx='38' fill='%23527D98'/%3E%3Crect x='146' y='318' width='170' height='76' rx='38' fill='%2304242D'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;500&display=swap">
<style>
/* Layout: wide screens show paper and navy side by side, the same four pieces on each, shared rows so they sit level.
   Narrow screens show one at a time: paper in light mode, navy in dark mode, with a switch. */
:root{--paper:#FEFDFB;--sand:#EFECE4;--navy:#04242D;--ink:#04242D;--steel:#527D98;--coral:#FF6B4A;--cool:#DCE8F0;--warm:#FCE3D9;--ease:cubic-bezier(.22,1,.36,1);
  --page:var(--sand);--show-paper:flex;--show-navy:none;--card-bg:#FFFFFF;--card-fg:#04242D;--card-last:#04242D;--card-line:rgba(4,36,45,.14);--card-shadow:rgba(4,36,45,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:var(--navy);--show-paper:none;--show-navy:flex;--card-bg:#FEFDFB;--card-fg:#04242D;--card-last:#04242D;--card-line:rgba(4,36,45,.14);--card-shadow:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--page:var(--navy);--show-paper:none;--show-navy:flex;--card-bg:#FEFDFB;--card-fg:#04242D;--card-last:#04242D;--card-line:rgba(4,36,45,.14);--card-shadow:rgba(0,0,0,.7);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--card-fg);font-family:"Work Sans",system-ui,sans-serif;min-height:100%;position:relative;isolation:isolate}
main{display:grid;grid-template-columns:1fr;grid-auto-rows:auto;align-content:center;min-height:100svh;row-gap:clamp(36px,6vh,72px);padding-top:max(8vh,calc(env(safe-area-inset-top,0px) + 56px));padding-bottom:calc(6vh + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.cell{--fg:var(--ink);--last:var(--ink);display:flex;justify-content:center;align-items:center;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.cell.paper{display:var(--show-paper)}
.cell.navy{--fg:#FEFDFB;--last:#FFFFFF;color:var(--fg);display:var(--show-navy)}
.mark{height:clamp(88px,22vw,120px);width:auto;display:block}
.last{fill:var(--last)}
/* the favicon: the S at rest, eases to three dots while the pointer stays, eases back when it leaves */
.fav{position:relative;width:clamp(120px,30vw,148px);aspect-ratio:1;max-width:100%}
.fav svg{position:absolute;inset:0;width:100%;height:100%}
.cell.paper .fav::before{content:"";position:absolute;inset:3.1%;border-radius:23.4%;box-shadow:0 14px 34px -14px rgba(4,36,45,.35);z-index:-1}
.fav i{position:absolute;height:16.03%;border-radius:999px;left:41.98%;width:16.03%;transition:left .7s var(--ease),width .7s var(--ease);will-change:left,width}
.fav i:nth-child(2){top:20.89%;left:37.34%;width:35.86%;background:var(--coral)}
.fav i:nth-child(3){top:41.98%;background:var(--steel)}
.fav i:nth-child(4){top:63.08%;left:26.8%;width:35.86%;background:var(--ink)}
.fav--dark i:nth-child(4){background:#FFFFFF}
.fav:hover i:nth-child(2),.fav:hover i:nth-child(4){left:41.98%;width:16.03%}
@media (prefers-reduced-motion:reduce){.fav i{transition:none}}
/* the wordmark, as the brand guide sets it, with the three dots as its divider */
.wm{display:inline-flex;align-items:center;gap:.42em;font-size:clamp(20px,5.6vw,36px);line-height:1;white-space:nowrap;color:var(--fg)}
.wm b{font-weight:500;letter-spacing:.18em;margin-right:-.18em}
.wm i{font-style:normal;font-weight:300;letter-spacing:.14em;margin-right:-.14em;opacity:.85}
.wm .dots{height:.7em;width:.2em;display:block;overflow:visible}
.wm .s{height:1.06em;width:auto;display:block;margin-right:.1em}
/* the legend: three true columns so the words line up */
.legend{grid-column:1/-1;justify-self:center;margin:2vh 16px 0;display:grid;grid-template-columns:auto auto 1fr;column-gap:18px;row-gap:18px;align-items:center;padding:26px 30px;border:1px solid var(--card-line);border-radius:20px;background:var(--card-bg);box-shadow:0 18px 50px -24px var(--card-shadow);font-size:clamp(15px,1.6vw,18px);font-weight:300;letter-spacing:.02em;color:var(--card-fg);max-width:calc(100% - 32px);box-sizing:border-box}
.legend span{width:.9em;height:.9em;border-radius:50%;display:block}
.legend .ink{background:var(--card-last)}
.legend b{font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.78em;white-space:nowrap}
.legend small{font-size:1em;opacity:.8;min-width:0}
@media (max-width:420px){.legend{grid-template-columns:auto 1fr;row-gap:6px}.legend small{grid-column:2;margin-bottom:12px}.legend small:last-child{margin-bottom:0}}
/* the switch: narrow screens only */
.switch{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));z-index:2;font:500 12px/1 "Work Sans",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--card-fg);background:var(--card-bg);border:1px solid var(--card-line);border-radius:999px;padding:9px 14px;cursor:pointer}
.switch:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (min-width:760px){
  body{background:var(--sand)}
  main{grid-template-columns:1fr 1fr;padding-top:7vh;row-gap:clamp(36px,5.5vh,72px)}
  body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
  body::before{background:linear-gradient(90deg,transparent 50%,var(--navy) 50%),radial-gradient(ellipse 42% 85% at 6% 8%,color-mix(in srgb,var(--cool) 80%,transparent),transparent 100%),radial-gradient(ellipse 45% 90% at 47% 98%,color-mix(in srgb,var(--warm) 85%,transparent),transparent 100%),var(--sand)}
  body::after{background:radial-gradient(ellipse 40% 80% at 95% 10%,rgba(82,125,152,.22),transparent 100%)}
  .cell.paper{display:flex}.cell.navy{display:flex}
  .mark{height:clamp(72px,13vh,190px)}.fav{width:clamp(96px,16vh,230px)}.wm{font-size:clamp(16px,3.4vh,52px)}
  .legend{font-size:clamp(15px,1.5vh,22px);padding:1.8em 2.1em;margin-top:3vh}
  .legend{--card-bg:#FFFFFF;--card-fg:#04242D;--card-last:#04242D;--card-line:rgba(4,36,45,.14);--card-shadow:rgba(4,36,45,.5)}
  .switch{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="f-clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  <filter id="f-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
</defs></svg>

<button class="switch" id="switch" type="button" aria-label="Switch between light and dark">Dark</button>

<main>
<div class="cell paper"><svg class="mark" viewBox="146 118 220 276" role="img" aria-label="Stratos Edge"><rect x="196" y="118" width="170" height="76" rx="38" fill="#FF6B4A"/><rect x="218" y="218" width="76" height="76" rx="38" fill="#527D98"/><rect class="last" x="146" y="318" width="170" height="76" rx="38"/></svg></div>
<div class="cell navy"><svg class="mark" viewBox="146 118 220 276" role="img" aria-label="Stratos Edge"><rect x="196" y="118" width="170" height="76" rx="38" fill="#FF6B4A"/><rect x="218" y="218" width="76" height="76" rx="38" fill="#527D98"/><rect class="last" x="146" y="318" width="170" height="76" rx="38"/></svg></div>

<div class="cell paper"><div class="fav" role="img" aria-label="Stratos Edge icon">
  <svg viewBox="0 0 512 512" aria-hidden="true"><g clip-path="url(#f-clip)"><rect x="16" y="16" width="480" height="480" fill="#FDFCFA"/><rect x="16" y="16" width="480" height="480" filter="url(#f-grain)" opacity="0.11" style="mix-blend-mode:multiply"/></g><rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#04242D" stroke-opacity="0.14" stroke-width="2"/></svg>
  <i></i><i></i><i></i></div></div>
<div class="cell navy"><div class="fav fav--dark" role="img" aria-label="Stratos Edge icon, dark">
  <svg viewBox="0 0 512 512" aria-hidden="true"><g clip-path="url(#f-clip)"><rect x="16" y="16" width="480" height="480" fill="#0B3441"/><rect x="16" y="16" width="480" height="480" filter="url(#f-grain)" opacity="0.07" style="mix-blend-mode:screen"/></g><rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FEFDFB" stroke-opacity="0.14" stroke-width="2"/></svg>
  <i></i><i></i><i></i></div></div>

<div class="cell paper"><span class="wm" role="img" aria-label="Stratos Edge"><svg class="s" viewBox="146 118 220 276" aria-hidden="true" style="visibility:hidden"><rect x="146" y="118" width="220" height="276"/></svg><b>STRATOS</b><svg class="dots" viewBox="-2 -2 20 70" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#FF6B4A"/><circle cx="8" cy="33" r="8" fill="#527D98"/><circle class="last" cx="8" cy="58" r="8"/></svg><i>EDGE</i></span></div>
<div class="cell navy"><span class="wm" role="img" aria-label="Stratos Edge"><svg class="s" viewBox="146 118 220 276" aria-hidden="true" style="visibility:hidden"><rect x="146" y="118" width="220" height="276"/></svg><b>STRATOS</b><svg class="dots" viewBox="-2 -2 20 70" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#FF6B4A"/><circle cx="8" cy="33" r="8" fill="#527D98"/><circle class="last" cx="8" cy="58" r="8"/></svg><i>EDGE</i></span></div>

<div class="cell paper"><span class="wm" role="img" aria-label="Stratos Edge"><svg class="s" viewBox="146 118 220 276" aria-hidden="true"><rect x="196" y="118" width="170" height="76" rx="38" fill="#FF6B4A"/><rect x="218" y="218" width="76" height="76" rx="38" fill="#527D98"/><rect class="last" x="146" y="318" width="170" height="76" rx="38"/></svg><b>STRATOS</b><svg class="dots" viewBox="-2 -2 20 70" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#FF6B4A"/><circle cx="8" cy="33" r="8" fill="#527D98"/><circle class="last" cx="8" cy="58" r="8"/></svg><i>EDGE</i></span></div>
<div class="cell navy"><span class="wm" role="img" aria-label="Stratos Edge"><svg class="s" viewBox="146 118 220 276" aria-hidden="true"><rect x="196" y="118" width="170" height="76" rx="38" fill="#FF6B4A"/><rect x="218" y="218" width="76" height="76" rx="38" fill="#527D98"/><rect class="last" x="146" y="318" width="170" height="76" rx="38"/></svg><b>STRATOS</b><svg class="dots" viewBox="-2 -2 20 70" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#FF6B4A"/><circle cx="8" cy="33" r="8" fill="#527D98"/><circle class="last" cx="8" cy="58" r="8"/></svg><i>EDGE</i></span></div>

<div class="legend">
  <span style="background:var(--coral)"></span><b>People</b><small>Get the right people in and keep them</small>
  <span style="background:var(--steel)"></span><b>Productivity</b><small>Help people do more valuable work</small>
  <span class="ink"></span><b>Automation</b><small>Shift back-office work to digital employees</small>
</div>
</main>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById("switch"), mq=matchMedia("(prefers-color-scheme: dark)");
  function dark(){var t=root.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function label(){btn.textContent=dark()?"Light":"Dark"}
  try{var saved=localStorage.getItem("se-theme");if(saved==="dark"||saved==="light")root.setAttribute("data-theme",saved)}catch(e){}
  btn.addEventListener("click",function(){var next=dark()?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("se-theme",next)}catch(e){}label()});
  mq.addEventListener("change",label); label();
})();
</script>
</body>
</html>

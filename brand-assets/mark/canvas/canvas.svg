<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"><title>Stratos Edge canvas</title><defs>
    <clipPath id="c-clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="c-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <g clip-path="url(#c-clip)"><rect class="bg" x="16" y="16" width="480" height="480" fill="#FDFCFA"/><rect class="gr" x="16" y="16" width="480" height="480" filter="url(#c-grain)" opacity="0.11" style="mix-blend-mode:multiply"/></g>
  <rect class="ed" x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#04242D" stroke-opacity="0.14" stroke-width="2"/>
  </svg>

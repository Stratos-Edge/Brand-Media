<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"><title>Stratos Edge canvas</title><defs>
    <clipPath id="c-clip"><rect x="0" y="0" width="512" height="512" rx="0"/></clipPath>
    <filter id="c-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <g clip-path="url(#c-clip)"><rect class="bg" x="0" y="0" width="512" height="512" fill="#0B3441"/><rect class="gr" x="0" y="0" width="512" height="512" filter="url(#c-grain)" opacity="0.07" style="mix-blend-mode:screen"/></g>
  
  </svg>
